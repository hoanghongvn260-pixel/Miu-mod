<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miumod Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #0088cc; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #006699; }
        .badge { background: #ff9800; color: white; padding: 3px 8px; border-radius: 12px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🚀 Miumod Key Store</h2>
    
    <div class="card">
        <h3>🛒 Mua Key Tự Động</h3>
        <p>STK: <strong>0965766062</strong> (MBBank)</p>
        <p>Chủ TK: <strong>Nguyen Tien Phong</strong></p>
        <button onclick="navigator.clipboard.writeText('0965766062');window.Telegram.WebApp.showAlert('Đã sao chép STK!');" style="background:#28a745;">Sao chép STK</button>
    </div>

    <div class="card">
        <h3>🔗 Lấy Link Vượt Kép</h3>
        <p>Kho hiện tại còn: <span id="keyCount" class="badge">10</span> Key</p>
        <button onclick="getLink()">Mở Link Vượt Key</button>
    </div>

    <script>
        // Link Google Apps Script của ông
        const scriptExecUrl = "https://script.google.com/macros/s/AKfycbyC8VNqsBNx2hr9SeICLBMXKJJIWJqQN5znSyT3AqDxbAQo5oZqw9ue2OiKmA9rA56n/exec";

        function getLink() {
            let tg = window.Telegram.WebApp;
            tg.expand();
            let id = tg.initDataUnsafe?.user?.id;
            if (!id) {
                tg.showAlert("Vui lòng mở trên ứng dụng Telegram!");
                return;
            }
            
            // Chuỗi vượt kép chuẩn xác: Link4m -> Vượt Nhanh -> Link4m -> Google Apps Script
            let destinationUrl = scriptExecUrl + "?chat_id=" + id;
            let link4mStep2 = "https://link4m.co/st?api=68b2988438d8cc2a1f108c6d&url=" + encodeURIComponent(destinationUrl);
            let vuotNhanhUrl = "https://vuotnhanh.com/st?api=c74b2166-fdb0-4f86-a109-9f299fd369b6&url=" + encodeURIComponent(link4mStep2);
            let link4mStep1 = "https://link4m.co/st?api=68b2988438d8cc2a1f108c6d&url=" + encodeURIComponent(vuotNhanhUrl);

            tg.openLink(link4mStep1);
        }
    </script>
</body>
</html>
